name: Build J.A.R.V.I.S. Android APK

on:
  push:
    branches: [main, audit/jarvis-mark-vii-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Apply Android manifest
        run: cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install native JARVIS Android bridge
        run: |
          mkdir -p android/app/src/main/java/com/stark/jarvis/os
          cp android-template/src/main/java/com/stark/jarvis/os/*.java android/app/src/main/java/com/stark/jarvis/os/
      - name: Validate embedded JavaScript and HTML IDs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim());
          if (scripts.length === 0) throw new Error('No inline JavaScript found to validate.');
          for (let i = 0; i < scripts.length; i++) {
            const file = path.join(os.tmpdir(), `jarvis-inline-${i}.js`);
            fs.writeFileSync(file, scripts[i][2]);
            const check = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (check.status !== 0) {
              process.stderr.write(check.stderr || check.stdout);
              process.exit(check.status || 1);
            }
          }
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)]
            .map(([, id]) => id)
            .filter(id => !/[\$\{]/.test(id));
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) {
            throw new Error('Duplicate static HTML IDs: ' + [...new Set(duplicates)].join(', '));
          }
          console.log(`Validated ${scripts.length} inline scripts and ${ids.length} static IDs.`);
          NODE
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mark-VII-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
